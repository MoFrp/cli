version: 2

builds:
  - skip: true

checksum:
  name_template: '{{ .ProjectName }}_sha256_checksums.txt'
  algorithm: sha256
  extra_files:
    - glob: ./release/packages/*

release:
  github:
    owner: fatedier
    name: frp
  draft: false
  replace_existing_draft: true
  replace_existing_artifacts: true
  extra_files:
    - glob: ./release/packages/*

snapshot:
  version_template: "{{ .Version }}-next"
